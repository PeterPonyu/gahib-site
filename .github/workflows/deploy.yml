name: Deploy GAHIB site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pre-publication mode default. Override via repo Variables to switch.
      NEXT_PUBLIC_PREPUB: ${{ vars.NEXT_PUBLIC_PREPUB || 'true' }}
      NEXT_PUBLIC_BASE_PATH: /gahib-site
    steps:
      # actions/checkout@v4
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332

      # pnpm/action-setup@v4 — pinned to 9.12.0 release
      - uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d
        with:
          version: 9.12.0

      # actions/setup-node@v4
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Confidentiality gate — figure allowlist
        run: pnpm run check:figures

      - name: Confidentiality gate — MDX references
        run: pnpm run check:mdx-refs

      - name: Build static export
        run: pnpm build

      - name: Confidentiality gate — post-build artifact scan
        run: pnpm run check:output

      # actions/upload-pages-artifact@v3
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v4
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac1b1c14d56

      - name: Deploy-time verification — robots.txt + index grep
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Verifying $URL"
          # Wait for CDN to settle
          sleep 10
          # robots.txt MUST disallow indexing while in prepub mode
          if [ "${{ vars.NEXT_PUBLIC_PREPUB || 'true' }}" = "true" ]; then
            curl -sf "${URL}robots.txt" | tee /dev/stderr | grep -q '^Disallow: /' || {
              echo "FAIL: robots.txt does not disallow indexing while NEXT_PUBLIC_PREPUB=true" >&2
              exit 1
            }
          fi
          # Index page MUST NOT contain any embargoed substring while in prepub mode
          if [ "${{ vars.NEXT_PUBLIC_PREPUB || 'true' }}" = "true" ]; then
            HTML=$(curl -sf "${URL}")
            if echo "$HTML" | grep -E 'interp_|_all_metrics|hyperparam_|latent_dim_|fig_downstream_|computational_' >/dev/null; then
              echo "FAIL: deployed index contains embargoed substring" >&2
              exit 1
            fi
          fi
          echo "Deploy-time verification passed."
