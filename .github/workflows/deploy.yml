name: Deploy GAHIB site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Pre-publication mode default. Override via repo Variables to switch.
      NEXT_PUBLIC_PREPUB: ${{ vars.NEXT_PUBLIC_PREPUB || 'true' }}
      NEXT_PUBLIC_BASE_PATH: /gahib-site
    steps:
      # actions/checkout@v4 (resolved 2026-05-01)
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      # pnpm/action-setup@v4 (resolved 2026-05-01)
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          version: 9.12.0

      # actions/setup-node@v4 (resolved 2026-05-01)
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Confidentiality gate — figure allowlist
        run: pnpm run check:figures

      - name: Confidentiality gate — MDX references
        run: pnpm run check:mdx-refs

      - name: Build static export
        run: pnpm build

      - name: Verify indexing artifact contract
        run: |
          if [ "${{ vars.NEXT_PUBLIC_PREPUB || 'true' }}" = "false" ]; then
            pnpm run check:indexing --mode published
          else
            pnpm run check:indexing --mode prepub
          fi

      - name: Confidentiality gate — post-build artifact scan
        run: pnpm run check:output

      # actions/upload-pages-artifact@v3
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: out

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # actions/deploy-pages@v4 (resolved 2026-05-01)
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128

      - name: Deploy-time verification — robots.txt + index grep
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Verifying $URL"
          # Wait for CDN to settle
          sleep 10
          # robots.txt MUST disallow indexing while in prepub mode
          if [ "${{ vars.NEXT_PUBLIC_PREPUB || 'true' }}" = "true" ]; then
            curl -sf "${URL}robots.txt" | tee /dev/stderr | grep -q '^Disallow: /' || {
              echo "FAIL: robots.txt does not disallow indexing while NEXT_PUBLIC_PREPUB=true" >&2
              exit 1
            }
          fi
          # Index page MUST NOT contain any embargoed substring while in prepub mode
          if [ "${{ vars.NEXT_PUBLIC_PREPUB || 'true' }}" = "true" ]; then
            HTML=$(curl -sf "${URL}")
            if echo "$HTML" | grep -E 'interp_|_all_metrics|hyperparam_|latent_dim_|fig_downstream_|computational_' >/dev/null; then
              echo "FAIL: deployed index contains embargoed substring" >&2
              exit 1
            fi
          fi
          echo "Deploy-time verification passed."
